xt":"Таштық мәдениеті"},{"key":"E","text":"Үсті-Нарым мәдениеті"}],"correct":"C","sourceCorrect":"C","grading":"source","issue":"","references":[],"explanation":"Жүктелген файлдың жауап кілтінде C нұсқасы белгіленген."}],"passages":{"saka":{"title":"Тұмар патшайым мен Шырақ туралы мәтін","paragraphs":["б.з.б. 530 жылы Кир бастаған парсы әскері сақ жеріне басып кіреді. Сол уақыттарда сақтарды Тұмар патшайым билеген болатын. Әйел екендігіне қарамастан, ол парсылармен қиян-кескі соғыс жүргізеді. Кир әскері Сырдария аумағына дейін келіп, сақ билеушісіне елші жібергенде Тұмар патшайым онымен келіссөз жүргізуден бас тартады. Оған ашуланған Кир сақтарға қарсы шабуылға шығады.","Бірақ, Тұмар патшайым өз жерінде соғысқанды қолайлы деп тауып, әдейі парсы әскерінің судан өтуіне мүмкіндік береді. Сөйтіп, жау қолын өзеннен өткізген сақ билеушісі біршама жер жүргеннен кейін қостарын тігеді. Бірақ парсы билеушісі қулыққа көшіп, қорыққан сыңай танытып, әдейі қашады. Сонда Тұмардың Ыспарғап есімді ұлы жаудың артынан қуамын деп алданып, қақпанға түсіп, қаза болады. Ал баласының өлімін естіген сақ патшайымы Кирдің басын әкелуге бұйрық беріп, қалың атты әскерімен парсы жеріне соғысқа аттанады.","Сол ұрыста сақтар парсы әскерін ойсырата жеңіп, Тұмар патшайым қанға тоймаған парсы билеушісі Кирдің басын алдырып, жазалайды. Ол әскерлеріне тері қапты қанмен толтыруды бұйырып, Кирдің басын ұстап тұрып: «Сен осында қанды аңсап келіп едің, енді өз қаныңды тойып іш!» деп, өшін алған. Осы аңыздан сақтардың батыл, ержүрек, жауынгер тайпа болғандығы дәлелдейді.","Ал, Шырақ есімді сақ малшысы туралы аңыз сақтардың өте ақылды және жауынгер болғанын тағы бір дәлелдемек. Сол заманда Шырақ есімді малшы жігіт өз денесін пышақпен тілгілеп, алдынан шыққан жауға сақ көсемдерінен қорлық көрдім деп, ақылдылығымен жау әскерін алдап түсірген. Оның қызыл-ала қан болған денесін көрген жау қолы малшы жігіттің сөзіне сеніп, оның артынан еремін деп, шөл далада адасып, қырылып қалады."],"note":"Word файлында қысқарған мәтін бұрын жүктелген дәл осы 30 сұрақтың PDF нұсқасынан толықтырылды.","sourcePath":"assets/source/questions.pdf"}},"notes":["Барлық 11 файлдағы 330 сұрақ сақталған. Орысша аудармалар куиз мәтінінен алынып тасталды.","Сұрақтар жылдар мен олимпиада кезеңдеріне бөлінбей, аралас беріледі.","Қайталанатын 30 тапсырма да сақталған. Құжаттағы нөмірлері әр сұрақтың дерегінде көрсетілген.","Картасы, сызбасы немесе жеткілікті мәнмәтіні жоқ тапсырмалар көрінеді, бірақ автоматты ұпайға қосылмайды.","Дереккөзбен тексерілген түзетулер бөлек көрсетіледі. Қалған жауаптар жүктелген файл кілтіне сүйенеді."],"maxPoints":550,"gradableCount":308,"gradableMaxPoints":495,"reviewCount":22,"correctedCount":17}</script>

    ids.add(q.id);
    if (typeof q.prompt !== 'string' || !q.prompt.trim() || q.prompt.length > 12000) errors.push(`${i+1}: сұрақ мәтінін тексеріңіз.`);
    if (!Array.isArray(q.options) || q.options.map(o=>o?.key).join('') !== 'ABCDE' || q.options.some(o=>typeof o?.text !== 'string' || !o.text.trim() || o.text.length > 6000)) errors.push(`${i+1}: A–E бес жауап нұсқасы болуы керек.`);
    if (q.correct !== null && (typeof q.correct !== 'string' || !/^[A-E]$/.test(q.correct))) errors.push(`${i+1}: жауап A–E немесе бағаланбайтын тапсырма болуы керек.`);
    if (![1,2,3].includes(q.points) || !['source','verified','manual','review'].includes(q.grading)) errors.push(`${i+1}: ұпай немесе жауап мәртебесі қате.`);
    if ((q.grading === 'review') !== (q.correct === null)) errors.push(`${i+1}: бағаланбайтын тапсырманың мәртебесін тексеріңіз.`);
    for (const field of ['context','explanation','issue']) if (q[field] != null && (typeof q[field] !== 'string' || q[field].length > 20000)) errors.push(`${i+1}: мәтін өрісін тексеріңіз.`);
    if (reference) {
      const ref = reference.questions[i];
      for (const field of ['id','number','points','sourceId','sourceNumber','sourceCorrect','passageId','references']) if (JSON.stringify(q[field]) !== JSON.stringify(ref[field])) errors.push(`${i+1}: сұрақтың түпнұсқа деректерін сақтаңыз.`);
    }
  }
  if (reference && JSON.stringify(data.files) !== JSON.stringify(reference.files)) errors.push('Бастапқы файлдар тізімін сақтаңыз.');
  return [...new Set(errors)];
}

function withDraft(base, draft) {
  const result = clone(base);
  for (const q of result.questions) {
    const entry = draft?.[q.id];
    if (entry) for (const field of editableFields) if (Object.hasOwn(entry, field)) q[field] = clone(entry[field]);
  }
  result.gradableCount = result.questions.filter(q=>q.correct !== null).length;
  result.reviewCount = result.questions.length - result.gradableCount;
  result.gradableMaxPoints = result.questions.reduce((sum,q)=>sum+(q.correct===null?0:q.points),0);
  result.correctedCount = result.questions.filter(q=>q.correct!==null&&q.correct!==q.sourceCorrect).length;
  return result;
}

function makeOrder(data, count = 30, random = Math.random, mixed = true) {
  const ids = data.questions.map(q => q.id);
  if (mixed) for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.max(0,Math.min(i,Math.floor(random() * (i + 1))));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
  const size = count === 'all' ? ids.length : Math.max(1,Math.min(ids.length,Math.trunc(Number(count)) || 30));
  return ids.slice(0,size);
}

function validSession(data, state) {
  if (!state?.started) return true;
  const ids = new Set(data.questions.map(q=>q.id));
  return Array.isArray(state.order) && state.order.length > 0 && state.order.length <= 330 && new Set(state.order).size === state.order.length && state.order.every(id=>ids.has(id)) && ['practice','exam'].includes(state.mode);
}

function scoreQuiz(data, answers = {}, order = data.questions.map(q=>q.id), checkedOnly = false) {
  const byId = new Map(data.questions.map(q=>[q.id,q]));
  const result = {earned:0,max:0,total:order.length,answered:0,correct:0,wrong:0,scoredCount:0,reviewCount:0,reviewSeen:0,levels:{1:{earned:0,max:0},2:{earned:0,max:0},3:{earned:0,max:0}}};
  for (const id of order) {
    const q = byId.get(id);
    if (!q) continue;
    const a = answers[id];
    const choice = q.options.some(o=>o.key === a?.choice) ? a.choice : null;
    const done = Boolean(choice || (q.correct === null && a?.seen)) && (!checkedOnly || a?.checked);
    if (done) result.answered++;
    if (q.correct === null) { result.reviewCount++; if (done) result.reviewSeen++; continue; }
    result.max += q.points;
    result.scoredCount++;
    result.levels[q.points].max += q.points;
    if (done && choice === q.correct) {
      result.correct++;
      result.earned += q.points;
      result.levels[q.points].earned += q.points;
    } else if (done && choice) result.wrong++;
  }
  result.remaining = result.total - result.answered;
  return result;
}

const $ = selector => document.querySelector(selector);

let draft = load(DRAFT_KEY,{}), base, data, byId, route, toastTimer, resultFilter = 'all';
const shownInBank = new Set();

function persist() { try { localStorage.setItem(STATE_KEY,JSON.stringify(state)); } catch { toast('Нәтижені файлға жүктеп алуға болады: браузерде сақтау қолжетімсіз.'); } }
function persistDraft() { try { localStorage.setItem(DRAFT_KEY,JSON.stringify(draft)); } catch { toast('Түзетулерді жоғалтпау үшін материалды файлға жүктеп алыңыз.'); } }

function parse() { const [name,query=''] = (location.hash.replace(/^#\/?/,'') || 'home').split('?'); return {name:['home','quiz','result','bank','question','notes','sources','edit'].includes(name)?name:'home',params:new URLSearchParams(query)}; }

function badge(q) { return q.correct === null ? '<span class="badge warm">Ұпайға қосылмайды</span>' : q.grading === 'verified' ? '<span class="badge">Дерекпен тексерілген</span>' : q.grading === 'manual' ? '<span class="badge">Өңделген жауап</span>' : '<span class="key-label">Файл кілті бойынша</span>'; }
function passage(q) { const source = data.passages?.[q.passageId]; return `${source?`<details class="passage" open><summary>${esc(source.title)}</summary>${source.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}<small>${esc(source.note)}</small></details>`:''}${q.context?.trim()?`<div class="passage"><strong>Тапсырмаға қосымша мәтін</strong><p class="preline">${esc(q.context)}</p></div>`:''}`; }
function banner() { const count = Object.keys(draft).length; return count ? `<div class="draft-banner"><span>Осы браузерде ${count} сұрақ өңделген.</span><a href="#/edit">Түзетулерді сақтау</a></div>` : ''; }

}

function quiz() {
  if (!state.started) return `<div class="empty">Алдымен басты беттен куизді бастаңыз.<div class="actions center"><a class="btn" href="#/home">Куизді таңдау</a></div></div>`;
  state.cursor = position(); persist();
  const n = state.cursor+1, q = byId.get(state.order[state.cursor]), a = state.answers[q.id];
  const reveal = state.finished || (state.mode === 'practice' && a?.checked);
  const s = scoreQuiz(data,state.answers,state.order);

  return `<div class="quiz-heading"><div><h1>Қазақстан тарихы</h1><small>5-сынып · ${state.mode === 'practice'?'Жаттығу: жауап бірден тексеріледі':'Сынақ: жауаптар соңында көрсетіледі'}</small></div><a class="btn light small" href="#/home">Басты бет</a></div><div class="quiz-layout"><section class="quiz-card"><div class="question-meta"><span class="badge">${n} / ${s.total}</span><span class="badge warm">${q.correct === null?'Танысу тапсырмасы':`${q.points} ұпай`}</span>${badge(q)}</div>${q.correct === null?`<p class="material-note">${esc(q.issue)}</p>`:''}${passage(q)}<h2 class="question-title" id="question-title">${esc(q.prompt)}</h2><div class="options" role="group" aria-labelledby="question-title">${options(q,a?.choice,reveal)}</div>${reveal?feedback(q,a):''}<div class="quiz-controls"><button class="btn light small" data-jump="${n-1}" ${n===1?'disabled':''}>← Алдыңғы</button>${state.mode === 'practice' && !reveal?`<button class="btn" data-action="check" ${q.correct !== null&&!a?.choice?'disabled':''}>${q.correct === null?'Файл кілтін қарау':'Жауапты тексеру'} →</button>`:n<s.total?`<button class="btn" data-jump="${n+1}">Келесі →</button>`:'<button class="btn" data-action="finish">Нәтижені көру →</button>'}${reveal&&!state.finished?`<button class="source-link" data-retry="${q.id}">Қайта жауап беру</button>`:''}</div><details class="source-detail"><summary>Сұрақтың бастапқы дерегі</summary><p>${esc(sourceLabel(q))}</p><a class="source-link" href="#/edit?id=${q.id}">Осы сұрақты өңдеу</a></details></section><aside class="quiz-side"><h2>Тапсырмалар</h2><label class="tiny" for="jump-number">Сұраққа өту</label><select id="jump-number">${state.order.map((id,i)=>`<option value="${i+1}" ${i===state.cursor?'selected':''}>${i+1}-сұрақ</option>`).join('')}</select><div class="grid-caption">${gridStart+1}–${Math.min(gridStart+30,s.total)} сұрақтар</div><div class="question-grid">${state.order.slice(gridStart,gridStart+30).map((id,i)=>{const k=gridStart+i, x=byId.get(id), answer=state.answers[id], revealed=state.finished||(state.mode==='practice'&&answer?.checked), done=answer?.choice||answer?.seen;return `<button data-jump="${k+1}" class="${k===state.cursor?'current':''} ${done?'answered':''} ${revealed&&x.correct!==null&&answer?.choice?(answer.choice===x.correct?'correct':'wrong'):''}" aria-label="${k+1}-сұрақ" ${k===state.cursor?'aria-current="step"':''}>${k+1}</button>`;}).join('')}</div>${s.total>30?`<div class="pager compact"><button class="btn light small" data-jump="${gridStart}" ${gridStart===0?'disabled':''}>←</button><span>${gridPage+1} / ${Math.ceil(s.total/30)}</span><button class="btn light small" data-jump="${gridStart+31}" ${gridStart+30>=s.total?'disabled':''}>→</button></div>`:''}<div class="side-progress" role="progressbar" aria-label="Орындалған тапсырмалар" aria-valuemin="0" aria-valuemax="${s.total}" aria-valuenow="${s.answered}"><span style="width:${s.answered/s.total*100}%"></span></div><p>${s.answered}/${s.total} тапсырма орындалды</p><button class="btn" data-action="finish">Аяқтау және нәтижені көру</button><span class="side-legend">Нәтиже бағалауға жарамды ${s.scoredCount} сұрақтан есептеледі.${s.reviewCount?`<br>${s.reviewCount} танысу тапсырмасы ұпайға қосылмайды.`:''}</span></aside></div>`;
}

function options(q,selected,reveal,bankMode=false) {
  return q.options.map(o=>{ const good=reveal&&q.correct!==null&&o.key===q.correct, bad=reveal&&q.correct!==null&&selected===o.key&&o.key!==q.correct; return `<button class="option ${selected===o.key?'selected':''} ${good?'correct':''} ${bad?'wrong':''}" ${bankMode?'':`data-choice="${o.key}"`} ${reveal||bankMode?'disabled':''} aria-pressed="${selected===o.key}"><span class="letter">${o.key}</span><span class="option-text">${esc(o.text)}</span>${good?'<span class="verdict">✓</span>':bad?'<span class="verdict">✕</span>':''}</button>`; }).join('');
}

function feedback(q,a) {
  if (q.correct === null) return `<div class="feedback neutral"><strong>Бұл тапсырма ұпайға қосылмайды</strong><p>${esc(q.explanation)}</p><p>Файлдың бастапқы кілті: <b>${esc(q.sourceCorrect)}</b> — ${esc(optionText(q,q.sourceCorrect))}. Бұл белгі тек салыстыру үшін көрсетілген.</p>${references(q)}</div>`;
  const good = a?.choice === q.correct;
  return `<div class="feedback ${good?'':'wrong'}"><strong>${a?.choice?(good?`Дұрыс! +${q.points} ұпай`:'Қайталап көріңіз'):'Жауап берілмеген'}</strong><p>Дұрыс нұсқа: <b>${q.correct}</b> — ${esc(optionText(q))}</p><p>${esc(q.explanation)}</p>${q.issue?`<p class="review-note">${esc(q.issue)}</p>`:''}${references(q)}</div>`;
}

function result() {
  if (!state.started) return '<div class="empty">Нәтиже шығару үшін алдымен куизді орындаңыз. <a href="#/home">Басты бетке өту →</a></div>';
  if (!state.finished) return '<div class="empty">Куиз әлі аяқталған жоқ.<div class="actions center"><a class="btn" href="#/quiz">Жалғастыру</a><button class="btn light" data-action="finish">Қазір аяқтау</button></div></div>';
  const s = scoreQuiz(data,state.answers,state.order), percentage = s.max?Math.round(s.earned/s.max*100):0;
  let questions = sessionQuestions();
  if (resultFilter === 'wrong') questions = questions.filter(q=>q.correct!==null&&state.answers[q.id]?.choice!==q.correct);
  if (resultFilter === 'review') questions = questions.filter(q=>q.correct===null);
  return `<div class="eyebrow">Орындалған жұмыс</div><h1 class="page-title">Куиз нәтижесі</h1><div class="result-banner"><div class="score-circle"><strong>${s.earned}</strong><small>${s.max} ұпайдан</small></div><div><h2>${s.max?`${percentage}% · Дайындықты жалғастырыңыз`:'Танысу тапсырмалары орындалды'}</h2><p><b>${s.correct}</b> дұрыс жауап · ${s.wrong} қате · ${s.remaining} орындалмаған тапсырма</p><p>${s.total} тапсырманың ${s.scoredCount}-і бағаланды; ${s.reviewCount} тапсырма ұпайға қосылмайды.</p></div></div><div class="level-grid">${[1,2,3].map(level=>`<div class="level-card"><b>ӘР ЖАУАПҚА ${level} ҰПАЙ</b><strong>${s.levels[level].earned} / ${s.levels[level].max}</strong><span>Бастапқы ұпай салмағы сақталған</span></div>`).join('')}</div><div class="actions result-actions"><button class="btn" data-action="retry-wrong" ${s.scoredCount-s.correct===0?'disabled':''}>Қате сұрақтарды қайталау →</button><button class="btn light" data-action="export-results">Нәтижені жүктеу ↓</button><a class="btn light" href="#/home">Жаңа куиз</a></div><div class="filters" aria-label="Нәтижені сүзу">${[['all','Барлығы'],['wrong','Қате және жауапсыз'],['review','Танысу тапсырмалары']].map(([id,label])=>`<button data-filter="${id}" class="${resultFilter===id?'active':''}" aria-pressed="${resultFilter===id}">${label}</button>`).join('')}</div><div class="result-list">${questions.map(q=>{const a=state.answers[q.id],good=a?.choice===q.correct&&q.correct!==null;return `<details class="result-item ${good?'':'wrong'}"><summary><span class="status">${q.correct===null?'i':good?'✓':'✕'}</span><span class="q">${esc(q.prompt)}</span><small>${q.correct===null?'Танысу':`${good?q.points:0}/${q.points}`}</small></summary><div class="result-content"><p>Таңдалған жауап: ${a?.choice?`${a.choice} — ${esc(optionText(q,a.choice))}`:'берілмеген'}</p>${feedback(q,a)}<div class="link-row"><a class="source-link" href="${qLink(q)}">Сұрақты қайта қарау</a><a class="source-link" href="#/edit?id=${q.id}">Өңдеу</a></div></div></details>`;}).join('')||'<div class="empty">Бұл тізімде тапсырма жоқ.</div>'}</div>`;
}

function bank() {

function question() {
  const q=byId.get(route.params.get('id'));

function notes() {
  const corrections=data.questions.filter(q=>q.correct!==null&&q.correct!==q.sourceCorrect);
  const review=data.questions.filter(q=>q.correct===null);
  return `<div class="eyebrow">Материалдардың анықтығы</div><h1 class="page-title">Түзетулер мен ескертпелер</h1><p class="subtitle">Сұрақтардың қазақша мәтіні мен бес нұсқасы сақталды. Қайшы кілттерге тексерілген жауап қойылды. Толық емес тапсырмалар ұпайдан шығарылды.</p><div class="stats"><div class="stat"><strong>${data.questions.length}</strong><span>сақталған<br>сұрақ</span></div><div class="stat"><strong>${corrections.length}</strong><span>дерекпен түзетілген<br>жауап кілті</span></div><div class="stat"><strong>${review.length}</strong><span>нақтылауды қажет ететін<br>тапсырма</span></div></div><div class="note-card"><h2>Жинақ қалай біріктірілді?</h2>${data.notes.map(note=>`<p class="reason">${esc(note)}</p>`).join('')}<p class="reason">Бір облыстық нұсқаның сұрақтары екінші нұсқамен бірдей. 18 қайшылықтың 17-сі дереккөздермен тексерілді; бір сұрақтың тұжырымы тым кең болғандықтан, оған ұпай есептелмейді.</p><p class="reason">Барлық бастапқы тапсырманың ұпай қосындысы — 550. Бағалауға жарамды ${data.questions.length-review.length} сұрақтың ең жоғары ұпайы — ${scoreQuiz(data).max}.</p></div><div class="section-heading"><h2>Тексерілген кілт түзетулері</h2></div>${corrections.map(q=>`<article class="note-card"><span class="badge">${esc(sourceLabel(q))}</span><h2>${esc(q.prompt)}</h2><div class="before-after"><div><strong>ФАЙЛДАҒЫ КІЛТ</strong>${q.sourceCorrect} — ${esc(optionText(q,q.sourceCorrect))}</div><div><strong>ТЕКСЕРІЛГЕН ЖАУАП</strong>${q.correct} — ${esc(optionText(q))}</div></div><p class="reason">${esc(q.explanation)}</p>${references(q)}<a class="source-link" href="${qLink(q)}">Тапсырманы ашу →</a></article>`).join('')}<div class="section-heading"><h2>Толықтыру немесе нақтылау қажет</h2></div><div class="result-list">${review.map(q=>`<details class="result-item"><summary><span class="status">i</span><span class="q">${esc(q.prompt)}</span></summary><div class="result-content"><p>${esc(sourceLabel(q))}</p><p>${esc(q.issue)}</p>${references(q)}<a class="source-link" href="${qLink(q)}">Сұрақты толық қарау →</a></div></details>`).join('')}</div>`;
}

function sources() {
  return `<div class="eyebrow">Жүктелген материалдар</div><h1 class="page-title">11 бастапқы файл</h1><p class="subtitle">Әр файлдағы 30 сұрақ куизге енгізілді. Куиздің сұрақтары мен жауап нұсқалары қазақша берілген. Төмендегі бастапқы Word файлдары тек салыстыру үшін, өзгертілмеген күйінде сақталған.</p><div class="source-files">${data.files.map(file=>`<section class="source-file"><span class="file-icon">WORD · ${file.count} СҰРАҚ</span><h2>${esc(file.title)}</h2><p>${esc(file.name)}</p>${offline?'<p>Бастапқы файлдар сайт нұсқасында қолжетімді.</p>':`<a class="btn light small" href="${esc(file.path)}" download>Бастапқы файлды жүктеу ↓</a>`}</section>`).join('')}</div><div class="note-card"><h2>Толықтырылған мәнмәтін</h2><p class="reason">Екінші кезең жинағының №26–30 тапсырмаларындағы қысқарған мәтін бұрын жүктелген дәл осы 30 сұрақтың PDF нұсқасынан алынды. Ол бес тапсырманың ішінде толық көрсетіледі.</p>${offline?'':`<a class="source-link" href="assets/source/questions.pdf" download>Бұрын жүктелген PDF →</a>`}</div><div class="actions"><button class="btn" data-action="export-content">Қазақша сұрақтар файлын жүктеу ↓</button>${offline?'':'<a class="btn light" href="quiz-offline.html" download>Интернетсіз куиз ↓</a>'}</div>`;
}

function editor() {
  const q=byId.get(route.params.get('id')) || data.questions[0];
  return `<div class="eyebrow">Материалдарды өзгерту</div><h1 class="page-title">Сұрақтарды өңдеу</h1><p class="subtitle">Сұрақты, бес жауап нұсқасын, кілтті немесе түсіндірмені түзетіңіз. Өзгеріс осы браузерде сақталады. Басқаларға беру үшін өңделген JSON немесе HTML файлын жүктеп алыңыз.</p><div class="editor-layout"><aside class="panel"><h2>330 сұрақ</h2><label for="editor-question">Өңделетін сұрақ</label><select id="editor-question">${data.questions.map(x=>`<option value="${x.id}" ${x.id===q.id?'selected':''}>${x.number}. ${esc(x.prompt.slice(0,68))}${x.prompt.length>68?'…':''}</option>`).join('')}</select><p class="editor-help">${esc(sourceLabel(q))}<br>Бастапқы ұпай: ${q.points}<br>Файлдағы кілт: ${q.sourceCorrect}</p><div class="editor-actions"><button class="btn small" data-action="export-content">Қазақша JSON жүктеу ↓</button><button class="btn light small" data-action="export-html">Өңделген HTML жүктеу ↓</button><button class="btn light small" data-action="import-content">JSON файлды енгізу ↑</button><button class="btn danger small" data-action="reset-draft">Өңдеулерді қалпына қайтару</button></div><p class="editor-help">Сайттағы ортақ нұсқаны жаңарту үшін өңделген JSON файлын осы чатқа жіберуге болады.</p></aside><section class="panel"><h2>${q.number}-сұрақ</h2><form id="editor-form" data-id="${q.id}"><label for="editor-prompt">Сұрақ мәтіні</label><textarea id="editor-prompt" required>${esc(q.prompt)}</textarea><label>Жауап нұсқалары</label>${q.options.map(o=>`<div class="option-editor"><span>${o.key}</span><textarea data-edit-option="${o.key}" aria-label="${o.key} жауап нұсқасы" required>${esc(o.text)}</textarea></div>`).join('')}<label for="editor-correct">Дұрыс жауап</label><select id="editor-correct"><option value="" ${q.correct===null?'selected':''}>Ұпайға қоспау — нақтылау қажет</option>${q.options.map(o=>`<option value="${o.key}" ${q.correct===o.key?'selected':''}>${o.key} — ${esc(o.text.slice(0,85))}</option>`).join('')}</select><label for="editor-context">Қосымша мәтін немесе толықтырылған үзінді</label><textarea id="editor-context">${esc(q.context||'')}</textarea><label for="editor-explanation">Жауаптың түсіндірмесі</label><textarea id="editor-explanation">${esc(q.explanation)}</textarea><label for="editor-issue">Ескерту</label><textarea id="editor-issue">${esc(q.issue)}</textarea><p id="editor-error" class="form-error" role="alert"></p><div class="actions"><button class="btn">Өзгерісті сақтау ✓</button>${draft[q.id]?`<button type="button" class="btn light" data-revert="${q.id}">Осы сұрақты қалпына қайтару</button>`:''}<a class="source-link" href="${qLink(q)}">Сұрақты қарау</a></div></form></section></div>`;
}

function start(mode,count=$('#question-count')?.value||'all',order=null) {
  if (state.started&&!state.finished&&Object.keys(state.answers).length&&!confirm('Жаңа куиз басталғанда ағымдағы жауаптар тазарады. Жалғастырасыз ба?')) return;
  state={...clone(initial),started:true,mode,order:order||makeOrder(data,count)}; persist(); resultFilter='all'; go('#/quiz?n=1');
}
function check() { const q=byId.get(state.order[state.cursor]),a=state.answers[q.id]||{}; if(q.correct!==null&&!a.choice){toast('Бір жауап нұсқасын таңдаңыз.');return;} state.answers[q.id]={...a,seen:true,checked:true};persist();const y=window.scrollY;render();window.scrollTo(0,y); }
function finish() { if(!state.started)return;const s=scoreQuiz(data,state.answers,state.order);if(s.remaining&&!confirm(`${s.remaining} тапсырма орындалмаған. Бар жауаптармен аяқтайсыз ба?`))return;state.finished=true;Object.values(state.answers).forEach(a=>a.checked=true);persist();resultFilter='all';go('#/result'); }
function download(value,name,type='application/json;charset=utf-8') { const content=typeof value==='string'?value:JSON.stringify(value,null,2);const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000); }
async function exportHtml() {
  try {
    let html;
    if(offline) html=document.documentElement.outerHTML;
    else {const response=await fetch('quiz-offline.html',{cache:'no-cache'});if(!response.ok)throw new Error('HTML файлы ашылмады.');html=await response.text();}
    const marker='<script id="quiz-data" type="application/json">',startAt=html.indexOf(marker)+marker.length,endAt=html.indexOf('<\/script>',startAt);
    if(startAt<marker.length||endAt<0)throw new Error('HTML файлының құрылымы сәйкес емес.');
    html=html.slice(0,startAt)+JSON.stringify(data).replace(/</g,'\\u003c')+html.slice(endAt);
    if(offline) { const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelector('#main').innerHTML='<div class="loading">Куиз сұрақтары ашылуда…</div>';doc.querySelector('#toast').className='toast';doc.querySelector('#toast').textContent='';html='<!doctype html>\n'+doc.documentElement.outerHTML; }
    download(html,'qazaqstan-tarihy-330-quiz.html','text/html;charset=utf-8');toast('Өңделген куиз HTML түрінде жүктелді.');
  } catch(error) { toast(`Файл жүктелмеді: ${error.message}`); }
}

document.addEventListener('click',event=>{
  const el=event.target.closest('button,a');if(!el)return;const d=el.dataset;
  if(el.getAttribute('aria-disabled')==='true'){event.preventDefault();return;}
  if(d.start){start(d.start);return;}
  if(d.jump){const n=Number(d.jump);if(n>=1&&n<=state.order.length)go(`#/quiz?n=${n}`);return;}
  if(d.choice&&route.name==='quiz') {const q=byId.get(state.order[state.cursor]),a=state.answers[q.id];if(state.finished||(state.mode==='practice'&&a?.checked))return;state.answers[q.id]={choice:d.choice,checked:false,seen:false};persist();const y=window.scrollY;render();window.scrollTo(0,y);document.querySelector(`[data-choice="${d.choice}"]`)?.focus({preventScroll:true});return;}
  if(d.retry){delete state.answers[d.retry];state.mode='practice';persist();render();return;}
  if(d.reveal){shownInBank.add(d.reveal);const y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(d.filter){resultFilter=d.filter;const y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(d.revert){delete draft[d.revert];persistDraft();setData(withDraft(base,draft));delete state.answers[d.revert];state.finished=false;persist();render();toast('Сұрақ бастапқы оқу нұсқасына қайтарылды.');return;}
  switch(d.action){
    case 'check':check();break;
    case 'finish':finish();break;
    case 'retry-wrong':{const ids=sessionQuestions().filter(q=>q.correct!==null&&state.answers[q.id]?.choice!==q.correct).map(q=>q.id);if(ids.length)start('practice',ids.length,ids);break;}
    case 'export-content':download(data,'qazaqstan-tarihy-330-kazaksha.json');break;
    case 'export-html':exportHtml();break;
    case 'import-content':$('#import-file').click();break;
    case 'reset-draft':if(confirm('Осы браузердегі барлық өңдеуді бастапқы оқу нұсқасына қайтарасыз ба?')){draft={};persistDraft();setData(clone(base));state=clone(initial);persist();render();}break;
    case 'export-results':download({title:data.title,grade:5,exportedAt:new Date().toISOString(),mode:state.mode,summary:scoreQuiz(data,state.answers,state.order),answers:sessionQuestions().map(q=>({id:q.id,question:q.prompt,selected:state.answers[q.id]?.choice||null,correct:q.correct,scored:q.correct!==null,sourceCorrect:q.sourceCorrect,earned:q.correct!==null&&state.answers[q.id]?.choice===q.correct?q.points:0,max:q.correct===null?0:q.points}))},'qazaqstan-tarihy-kuiz-natizhe.json');break;
  }
});

document.addEventListener('submit',event=>{
  if(event.target.id==='bank-search'){event.preventDefault();go(`#/bank?q=${encodeURIComponent($('#search-text').value.trim())}&type=${$('#search-type').value}`);return;}
  if(event.target.id!=='editor-form')return;
  event.preventDefault();const id=event.target.dataset.id,correct=$('#editor-correct').value||null;
  const change={prompt:$('#editor-prompt').value.trim(),options:[...document.querySelectorAll('[data-edit-option]')].map(el=>({key:el.dataset.editOption,text:el.value.trim()})),correct,grading:correct===null?'review':'manual',context:$('#editor-context').value.trim(),explanation:$('#editor-explanation').value.trim(),issue:$('#editor-issue').value.trim()};
  if(correct===null&&!change.issue)change.issue='Мұғалім нақтылауды қажет ететін тапсырма деп белгіледі.';
  const next={...draft,[id]:change},candidate=withDraft(base,next),errors=validateQuiz(candidate,base);
  if(errors.length){$('#editor-error').textContent=errors.join(' ');return;}
  draft=next;persistDraft();setData(candidate);delete state.answers[id];state.finished=false;persist();shownInBank.delete(id);render();toast('Сұрақ осы браузерде сақталды.');
});
document.addEventListener('change',event=>{if(event.target.id==='jump-number')go(`#/quiz?n=${event.target.value}`);if(event.target.id==='editor-question')go(`#/edit?id=${event.target.value}`);});
$('#import-file').addEventListener('change',async event=>{
  const file=event.target.files[0];if(!file)return;
  try{if(file.size>5e6)throw new Error('JSON файлы 5 МБ-тан аспауы керек.');const incoming=JSON.parse(await file.text()),errors=validateQuiz(incoming,base);if(errors.length)throw new Error(errors.join(' '));const next={};incoming.questions.forEach((q,i)=>{if(editableFields.some(field=>JSON.stringify(q[field])!==JSON.stringify(base.questions[i][field]))){next[q.id]={};for(const field of editableFields)if(Object.hasOwn(q,field))next[q.id][field]=q[field];}});draft=next;persistDraft();setData(withDraft(base,draft));state=clone(initial);persist();shownInBank.clear();render();toast('330 сұрақтың өңделген нұсқасы енгізілді.');}catch(error){toast(`Файл енгізілмеді: ${error.message}`);}event.target.value='';
});
document.addEventListener('keydown',event=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||route?.name!=='quiz'||!state.started)return;
  if(/^[a-e]$/i.test(event.key)){const el=document.querySelector(`[data-choice="${event.key.toUpperCase()}"]`);if(el&&!el.disabled){event.preventDefault();el.click();}}
  if(event.key==='ArrowLeft'&&state.cursor>0){event.preventDefault();go(`#/quiz?n=${state.cursor}`);}
  if(event.key==='ArrowRight'&&state.cursor<state.order.length-1){event.preventDefault();go(`#/quiz?n=${state.cursor+2}`);}
});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
async function boot(){
  try{
    if(offline)base=clone(QUIZ_EMBEDDED);
    else{const response=await fetch('data/quiz.json',{cache:'no-cache'});if(!response.ok)throw new Error('Сұрақтар файлы ашылмады.');base=await response.json();}
    const errors=validateQuiz(base);if(errors.length)throw new Error(errors.join(' '));
    try{const candidate=withDraft(base,draft);if(validateQuiz(candidate,base).length)throw new Error();setData(candidate);}catch{draft={};persistDraft();setData(clone(base));}
    if(!validSession(data,state)){state=clone(initial);persist();}
    render();
  }catch(error){$('#main').innerHTML=`<div class="error">${esc(error.message)}<p>Куизді қайта ашып көріңіз немесе интернетсіз HTML нұсқасын пайдаланыңыз.</p><button class="btn light" data-action="reload" onclick="location.reload()">Қайта ашу</button></div>`;}
}
boot();
</script>
</body>
</html>
