name: Publish olympiad materials

on:
  push:
    branches: [main]
    paths:
      - 'olimpiada-5/**'
      - '.github/workflows/publish-olimpiada-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: olympiad-pages-build
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub Pages rebuild from the configured publishing branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
